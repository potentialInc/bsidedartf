<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bSide - Edit Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link
        href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Inter:wght@300;400;500;600&amp;display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Geist', 'Inter', sans-serif;
            background-color: #050505;
            color: #ffffff;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Input Styles */
        .custom-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }

        .custom-input:focus-within {
            border-color: rgba(168, 85, 247, 0.4);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 1px rgba(168, 85, 247, 0.1);
        }

        /* Checkbox Custom */
        .custom-checkbox input:checked+div {
            background-color: #a855f7;
            border-color: #a855f7;
        }
    </style>
    <link id="all-fonts-link-font-dm-sans" rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&amp;display=swap">
    <style id="all-fonts-style-font-dm-sans">
        .font-dm-sans {
            font-family: 'DM Sans', sans-serif !important;
        }
    </style>
</head>

<body
    class="min-h-screen flex items-center justify-center overflow-hidden w-full bg-[#050505] selection:bg-purple-500/30">

    <!-- Ambient Background -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-20%] w-[600px] h-[600px] bg-purple-900/10 rounded-full blur-[120px]">
        </div>
        <div class="absolute bottom-[-10%] right-[-20%] w-[600px] h-[600px] bg-indigo-900/10 rounded-full blur-[120px]">
        </div>
        <div class="absolute inset-0 opacity-[0.02] bg-[url('https://grainy-gradients.vercel.app/noise.svg')]"></div>
    </div>

    <!-- Main UI Container -->
    <div
        class="relative z-10 w-full max-w-[400px] h-[840px] bg-[#080808] rounded-[40px] border border-white/10 shadow-2xl overflow-hidden ring-1 ring-white/5 flex flex-col">

        <!-- Header -->
        <div class="w-full px-6 pt-8 pb-4 flex justify-between items-center shrink-0">
            <button onclick="window.location.href='mypage.html'"
                class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-neutral-400 hover:text-white hover:bg-white/5 transition-colors group">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    data-lucide="arrow-left"
                    class="lucide lucide-arrow-left w-5 h-5 group-hover:-translate-x-0.5 transition-transform">
                    <path d="m12 19-7-7 7-7"></path>
                    <path d="M19 12H5"></path>
                </svg>
            </button>
            <span class="text-sm font-medium text-white">Edit Profile</span>
            <button class="text-xs font-semibold text-purple-400 hover:text-purple-300 transition-colors"
                onclick="saveProfile()">Save</button>
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 w-full overflow-y-auto hide-scrollbar px-6 pb-10">
            <!-- Avatar Upload -->
            <div class="flex flex-col items-center py-6">
                <div class="relative group cursor-pointer">
                    <!-- Reduced size from w-28 h-28 to w-24 h-24 -->
                    <div class="w-24 h-24 rounded-full p-0.5 border border-white/10 bg-white/5 overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?q=80&amp;w=400&amp;auto=format&amp;fit=crop"
                            id="profile-img-edit" alt="Profile"
                            class="w-full h-full rounded-full object-cover opacity-80 group-hover:opacity-60 transition-all">
                    </div>
                    <div
                        class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            data-lucide="camera" class="lucide lucide-camera w-8 h-8 text-white drop-shadow-lg">
                            <path
                                d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z">
                            </path>
                            <circle cx="12" cy="13" r="3"></circle>
                        </svg>
                    </div>
                </div>
                <span class="mt-3 text-xs font-medium text-neutral-400">Change Photo</span>
            </div>

            <!-- Form Fields -->
            <div class="space-y-5">
                <div class="space-y-1.5">
                    <label class="text-[10px] uppercase tracking-wider font-semibold text-neutral-500 ml-1">Display
                        Name</label>
                    <div class="custom-input rounded-xl px-4 py-3 flex items-center gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            data-lucide="user" class="lucide lucide-user w-4 h-4 text-neutral-500">
                            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" value="Elara Vance"
                            class="bg-transparent w-full text-sm text-white placeholder-neutral-600 outline-none font-medium">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-[10px] uppercase tracking-wider font-semibold text-neutral-500 ml-1">Bio</label>
                    <div class="custom-input rounded-xl px-4 py-3 flex items-start gap-3 h-28">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            data-lucide="text-quote" class="lucide lucide-text-quote w-4 h-4 text-neutral-500 mt-0.5">
                            <path d="M17 5H3"></path>
                            <path d="M21 12H8"></path>
                            <path d="M21 19H8"></path>
                            <path d="M3 12v7"></path>
                        </svg>
                        <textarea
                            class="bg-transparent w-full h-full text-sm text-white placeholder-neutral-600 outline-none resize-none font-medium leading-relaxed">Digital artist exploring the void between reality and dreams. 🌌</textarea>
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label
                        class="text-[10px] uppercase tracking-wider font-semibold text-neutral-500 ml-1">Location</label>
                    <div class="custom-input rounded-xl px-4 py-3 flex items-center gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            data-lucide="map-pin" class="lucide lucide-map-pin w-4 h-4 text-neutral-500">
                            <path
                                d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0">
                            </path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                        <input type="text" value="Tokyo, Japan"
                            class="bg-transparent w-full text-sm text-white placeholder-neutral-600 outline-none font-medium">
                    </div>
                </div>

                <div class="pt-2">
                    <label class="flex items-center justify-between p-1">
                        <span class="text-sm font-medium text-neutral-300">Public Profile</span>
                        <div
                            class="relative inline-block w-10 h-5 align-middle select-none transition duration-200 ease-in">
                            <input type="checkbox" name="toggle" id="toggle"
                                class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 border-[#1a1a1a] appearance-none cursor-pointer peer checked:right-0 right-5 transition-all duration-300">
                            <div
                                class="toggle-label block overflow-hidden h-5 rounded-full bg-neutral-800 cursor-pointer peer-checked:bg-purple-600 transition-colors duration-300">
                            </div>
                        </div>
                    </label>
                </div>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();

        function saveProfile() {
            // Simulated save action
            const btn = document.querySelector('button.text-purple-400');
            const originalText = btn.innerText;

            btn.innerText = 'Saved!';
            btn.classList.add('text-green-400');
            btn.classList.remove('text-purple-400');

            setTimeout(() => {
                window.location.href = 'mypage.html';
            }, 600);
        }
    </script>

</body>

</html>
