    <style>
        body {
            font-family: 'Geist', 'Inter', sans-serif;
            background-color: #050505;
            color: #ffffff;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Animations */
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-enter {
            animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .delay-100 {
            animation-delay: 0.05s;
        }

        .delay-200 {
            animation-delay: 0.1s;
        }

        .delay-300 {
            animation-delay: 0.15s;
        }

        .delay-400 {
            animation-delay: 0.2s;
        }

        .delay-500 {
            animation-delay: 0.25s;
        }

        .delay-600 {
            animation-delay: 0.3s;
        }

        /* Tab Transition */
        .tab-active {
            background-color: white;
            color: black;
            border-color: transparent;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .tab-inactive {
            background-color: transparent;
            color: #a3a3a3;
            /* neutral-400 */
            border-color: rgba(255, 255, 255, 0.1);
        }

        .tab-inactive:hover {
            color: white;
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }
    </style>

<body class="min-h-screen flex items-center justify-center overflow-x-hidden selection:bg-white/20 bg-[#050505] w-full">

    <!-- Ambient Background -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-indigo-900/10 rounded-full blur-[120px]">
        </div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-rose-900/10 rounded-full blur-[120px]">
        </div>
        <div class="absolute inset-0 flex justify-center opacity-[0.03]">
            <div class="border-r border-white h-full mx-20"></div>
            <div class="border-r border-white h-full mx-20"></div>
        </div>
    </div>

    <!-- Main UI Container -->
    <div
        class="relative z-10 w-full max-w-[400px] h-[840px] bg-[#080808] rounded-[40px] border border-white/10 shadow-2xl overflow-hidden ring-1 ring-white/5 flex flex-col">

        <!-- Header -->
        <div class="w-full px-6 pt-8 pb-2 flex items-center gap-4 z-40 bg-[#080808] shrink-0">
            <button
                class="hover:text-white transition-colors -ml-1 hover:bg-white/5 text-neutral-400 rounded-full pt-1 pr-1 pb-1 pl-1"
                onclick="window.location.href='index.html'" role="button">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                    class="w-[24px] h-[24px]" data-icon-replaced="true"
                    style="color: rgb(255, 255, 255); width: 24px; height: 24px;">
                    <path d="m15 18-6-6 6-6" class=""></path>
                </svg>
            </button>
            <span class="text-xl font-medium tracking-tight text-white">Notification</span>
        </div>

        <!-- Filter Tabs -->
        <div class="w-full px-6 py-4 flex items-center gap-2 shrink-0 border-b border-white/[0.02]">
            <a href="notification.html"
                class="tab-btn tab-inactive px-5 py-1.5 rounded-full border border-transparent transition-all text-[13px] font-medium tracking-wide">All</a>
            <a href="notification-event.html"
                class="tab-btn tab-active transition-all text-[13px] font-medium tracking-wide border rounded-full pt-1.5 pr-5 pb-1.5 pl-5">Event</a>
            <a href="notification-alert.html"
                class="tab-btn tab-inactive px-5 py-1.5 rounded-full border transition-all text-[13px] font-medium tracking-wide">Alert</a>
        </div>

        <!-- Scrollable Notification List -->
        <div class="flex-1 w-full overflow-y-auto hide-scrollbar px-5 py-4 space-y-3 pb-24 relative">

            <!-- EVENT: Exhibition Chansong -->
            <div data-category="event"
                class="notification-item animate-enter delay-200 relative w-full p-4 rounded-2xl bg-[#121212] border border-white/10 hover:bg-[#161616] transition-colors group cursor-pointer">
                <div
                    class="absolute top-4 left-4 w-1.5 h-1.5 rounded-full bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.6)] z-20">
                </div>
                <div class="flex gap-4">
                    <div
                        class="shrink-0 w-12 h-12 rounded-full bg-neutral-800 border border-white/10 overflow-hidden ring-1 ring-white/5 relative group-hover:ring-white/20 transition-all">
                        <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&amp;w=200&amp;auto=format&amp;fit=crop"
                            alt="Artist"
                            class="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition-opacity">
                    </div>
                    <div class="flex-1 flex flex-col pt-1">
                        <h3 class="text-[13px] font-semibold text-white mb-1 tracking-tight">Frieze Seoul 2026</h3>
                        <p class="text-[11px] text-neutral-400 leading-relaxed mb-2">
                            <span class="text-white font-medium">Chansong Kim</span> will be exhibiting new works in
                            Hall C.
                        </p>
                        <div class="flex items-center gap-3 mt-1">
                            <span
                                class="px-2 py-0.5 rounded-md bg-white/5 border border-white/5 text-[10px] text-neutral-300 font-medium">May
                                23-25</span>
                            <span class="text-[10px] text-neutral-600 font-medium tracking-wide">1d ago</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- EVENT: Exhibition Simon -->
            <div data-category="event"
                class="notification-item animate-enter delay-400 relative w-full p-4 rounded-2xl bg-[#121212] border border-white/10 hover:bg-[#161616] transition-colors group cursor-pointer">
                <div
                    class="absolute top-4 left-4 w-1.5 h-1.5 rounded-full bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.6)] z-20">
                </div>
                <div class="flex gap-4">
                    <div
                        class="shrink-0 w-12 h-12 rounded-full bg-neutral-800 border border-white/10 overflow-hidden ring-1 ring-white/5 relative group-hover:ring-white/20 transition-all">
                        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&amp;w=200&amp;auto=format&amp;fit=crop"
                            alt="Artist"
                            class="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition-opacity">
                    </div>
                    <div class="flex-1 flex flex-col pt-1">
                        <h3 class="text-[13px] font-semibold text-white mb-1 tracking-tight">Upcoming Exhibition</h3>
                        <p class="text-[11px] text-neutral-400 leading-relaxed mb-2">
                            <span class="text-white font-medium">Simon Ko</span> at Kiaf SEOUL, Sep 04.
                        </p>
                        <div class="flex items-center gap-3 mt-1">
                            <span
                                class="px-2 py-0.5 rounded-md bg-white/5 border border-white/5 text-[10px] text-neutral-300 font-medium">Sep
                                04</span>
                            <span class="text-[10px] text-neutral-600 font-medium tracking-wide">1d ago</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- EVENT: Past Event (Read) -->
            <div data-category="event"
                class="notification-item animate-enter delay-600 relative w-full p-4 rounded-2xl bg-[#0F0F0F] border border-white/5 hover:bg-[#161616] transition-colors group cursor-pointer opacity-80 hover:opacity-100">
                <div class="flex gap-4">
                    <div
                        class="shrink-0 w-12 h-12 rounded-full bg-neutral-900 border border-white/5 overflow-hidden ring-1 ring-white/5 grayscale group-hover:grayscale-0 transition-all duration-500">
                        <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?q=80&amp;w=200&amp;auto=format&amp;fit=crop"
                            alt="Artist"
                            class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition-opacity">
                    </div>
                    <div class="flex-1 flex flex-col pt-1">
                        <h3 class="text-[13px] font-semibold text-neutral-300 mb-1 tracking-tight">Gallery Night</h3>
                        <p class="text-[11px] text-neutral-500 leading-relaxed mb-1">
                            <span class="text-neutral-300 font-medium">Sarah Jenkins</span> invited you to the opening.
                        </p>
                        <span class="text-[10px] text-neutral-700 font-medium tracking-wide mt-2">2w ago</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- Bottom Fade -->
        <div
            class="absolute bottom-0 w-full h-24 bg-gradient-to-t from-[#080808] via-[#080808]/80 to-transparent pointer-events-none z-20">
        </div>

    </div>
