<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>b side - Draft Selector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased flex justify-center items-center min-h-screen selection:bg-white selection:text-black text-zinc-100 bg-zinc-950">

<!-- Phone Frame -->
<div class="w-full max-w-[400px] bg-black relative flex flex-col h-[100dvh] max-h-[850px] overflow-hidden shadow-2xl sm:rounded-[3rem] ring-8 ring-zinc-800/50 select-none cursor-default border border-zinc-800">
    
    <!-- Top Status Bar Area -->
    <div class="absolute top-0 w-full h-12 z-20 flex justify-center items-end pb-2 opacity-0">
        <div class="w-16 h-1 bg-zinc-800 rounded-full"></div>
    </div>

    <!-- Header -->
    <header class="flex items-center justify-center px-6 pt-14 pb-8 z-10 bg-black/80 backdrop-blur-md sticky top-0">
        <div class="text-2xl tracking-tighter text-white">
            <span class="font-medium">b</span><span class="font-light text-zinc-400">side</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center justify-center px-6 relative w-full overflow-hidden pb-10">
        
        <!-- Ambient Glow -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-zinc-800/20 blur-[100px] rounded-full pointer-events-none"></div>

        <!-- Draft Selection Cards -->
        <div class="flex flex-col gap-6 w-full max-w-sm z-10">
            
            <h1 class="text-3xl font-medium tracking-tight text-white mb-2 text-center">Select Draft</h1>
            <p class="text-sm text-zinc-400 text-center mb-8">Choose a design draft to view</p>

            <!-- Draft 1 Card -->
            <div class="group cursor-pointer" onclick="Router.navigateToDraft(1)">
                <div class="bg-[#141414] border border-white/10 rounded-2xl p-6 hover:border-white/20 transition-all shadow-2xl hover:shadow-white/5">
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-blue-500 to-purple-500 flex items-center justify-center text-white font-bold text-lg">
                                1
                            </div>
                            <div>
                                <h2 class="text-xl font-semibold text-white">Draft 1</h2>
                                <p class="text-xs text-zinc-400">Current Design</p>
                            </div>
                        </div>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-right w-5 h-5 text-zinc-400 group-hover:text-white group-hover:translate-x-1 transition-all">
                            <path d="M5 12h14"></path>
                            <path d="m12 5 7 7-7 7"></path>
                        </svg>
                    </div>
                    <div class="h-32 bg-zinc-900 rounded-xl overflow-hidden border border-zinc-800">
                        <div class="w-full h-full bg-[url(https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/e7279d8d-f598-4fd6-9343-5f6827402adb_800w.webp)] bg-cover bg-center opacity-60"></div>
                    </div>
                </div>
            </div>

            <!-- Draft 2 Card -->
            <div class="group cursor-pointer" onclick="if(typeof Router !== 'undefined' && Router.navigateToDraft) { Router.navigateToDraft(2); } else { window.location.href = 'Draft2-home.html'; }">
                <div class="bg-[#141414] border border-white/10 rounded-2xl p-6 hover:border-white/20 transition-all shadow-2xl hover:shadow-white/5">
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-orange-500 to-pink-500 flex items-center justify-center text-white font-bold text-lg">
                                2
                            </div>
                            <div>
                                <h2 class="text-xl font-semibold text-white">Draft 2</h2>
                                <p class="text-xs text-zinc-400">Alternative Design</p>
                            </div>
                        </div>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-right w-5 h-5 text-zinc-400 group-hover:text-white group-hover:translate-x-1 transition-all">
                            <path d="M5 12h14"></path>
                            <path d="m12 5 7 7-7 7"></path>
                        </svg>
                    </div>
                    <div class="h-32 bg-zinc-900 rounded-xl overflow-hidden border border-zinc-800">
                        <div class="w-full h-full bg-[url(https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/e7ac426d-f5d2-4702-8760-31ff1278f1f6_800w.webp)] bg-cover bg-center opacity-60"></div>
                    </div>
                </div>
            </div>

            <!-- Draft 3 Card -->
            <div class="group cursor-pointer" onclick="if(typeof Router !== 'undefined' && Router.navigateToDraft) { Router.navigateToDraft(3); } else { window.location.href = 'Draft3-home.html'; }">
                <div class="bg-[#141414] border border-white/10 rounded-2xl p-6 hover:border-white/20 transition-all shadow-2xl hover:shadow-white/5">
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-500 flex items-center justify-center text-white font-bold text-lg">
                                3
                            </div>
                            <div>
                                <h2 class="text-xl font-semibold text-white">Draft 3</h2>
                                <p class="text-xs text-zinc-400">Alternative Design</p>
                            </div>
                        </div>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-right w-5 h-5 text-zinc-400 group-hover:text-white group-hover:translate-x-1 transition-all">
                            <path d="M5 12h14"></path>
                            <path d="m12 5 7 7-7 7"></path>
                        </svg>
                    </div>
                    <div class="h-32 bg-zinc-900 rounded-xl overflow-hidden border border-zinc-800">
                        <div class="w-full h-full bg-[url(https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/cd72a53b-6aa7-44f6-a2f5-c1f742587382_800w.webp)] bg-cover bg-center opacity-60"></div>
                    </div>
                </div>
            </div>

        </div>

    </main>
    
</div>

<script src="router.js"></script>
<script>
    lucide.createIcons();
</script>

</body>
</html>
