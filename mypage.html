<style>
body { font-family: 'Geist', 'Inter', sans-serif; background-color: #050505; color: #ffffff; }
.hide-scrollbar::-webkit-scrollbar { display: none; }
.hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
/* Glassmorphism */
.glass-card {
background: rgba(255, 255, 255, 0.03);
backdrop-filter: blur(10px);
border: 1px solid rgba(255, 255, 255, 0.08);
}
.glass-card:hover {
background: rgba(255, 255, 255, 0.06);
border-color: rgba(255, 255, 255, 0.12);
}
/* Input Styles */
.custom-input {
background: rgba(255, 255, 255, 0.03);
border: 1px solid rgba(255, 255, 255, 0.1);
transition: all 0.2s ease;
}
.custom-input:focus-within {
border-color: rgba(168, 85, 247, 0.4);
background: rgba(255, 255, 255, 0.05);
box-shadow: 0 0 0 1px rgba(168, 85, 247, 0.1);
}
/* Animations */
.view-section {
transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
display: flex;
flex-direction: column;
opacity: 0;
pointer-events: none;
transform: translateX(20px);
z-index: 0;
}
.view-section.active {
opacity: 1;
pointer-events: auto;
transform: translateX(0);
z-index: 10;
position: relative;
}
.view-section.exit-left {
transform: translateX(-20px);
opacity: 0;
}
/* Checkbox Custom */
.custom-checkbox input:checked + div {
background-color: #a855f7;
border-color: #a855f7;
}
</style>

                </button>
                <span class="text-sm font-medium text-neutral-500">My Page</span>
                <div class="w-8"></div>
            </div>

            <!-- Scrollable Content -->
            <div class="flex-1 w-full overflow-y-auto hide-scrollbar pb-10">
                
                <!-- Profile Section -->
                <div class="flex flex-col items-center px-6 pt-4 pb-8">

                        </div>

                    <h1 class="mt-4 text-xl font-semibold text-white tracking-tight" id="profile-name-main">Elara Vance</h1>
                    
                    <button onclick="openView('view-edit')" class="mt-3 px-4 py-1.5 rounded-full border border-white/10 bg-white/[0.02] hover:bg-white/[0.08] hover:border-white/20 text-xs font-medium text-neutral-300 hover:text-white transition-all">
                        Profile Edit

                </div>

                <!-- Stats Grid -->
                <div class="px-5 mb-8">
                    <div class="grid grid-cols-3 gap-3">
                        <button class="glass-card flex flex-col items-center justify-center py-4 px-2 rounded-2xl group transition-all active:scale-95">
                            <span class="text-[10px] uppercase tracking-wider text-neutral-500 font-medium mb-1 group-hover:text-neutral-400">Captures</span>

                        </button>
                        <button class="glass-card flex flex-col items-center justify-center py-4 px-2 rounded-2xl group transition-all active:scale-95">
                            <span class="text-[10px] uppercase tracking-wider text-neutral-500 font-medium mb-1 group-hover:text-neutral-400">Following</span>
                            <span class="text-lg font-semibold text-white group-hover:text-blue-400 transition-colors">385</span>

                        <button class="glass-card flex flex-col items-center justify-center py-4 px-2 rounded-2xl group transition-all active:scale-95">

                            <span class="text-lg font-semibold text-white group-hover:text-green-400 transition-colors">271</span>

                </div>

                    </button>

                    <!-- Apply to Artist Button -->
                    <button onclick="openView('view-apply')" class="w-full h-14 px-5 rounded-2xl flex items-center justify-between group transition-all active:scale-[0.98] border border-purple-500/20 bg-purple-500/5 hover:bg-purple-500/10 hover:border-purple-500/30">
                        <div class="flex items-center gap-3.5">
                            <div class="p-1.5 rounded-lg bg-purple-500/10 text-purple-400 group-hover:text-purple-300 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="sparkles" class="lucide lucide-sparkles w-4 h-4"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"></path><path d="M20 2v4"></path><path d="M22 4h-4"></path><circle cx="4" cy="20" r="2"></circle></svg>
                            </div>

                    </button>

                    <div class="h-px w-full bg-white/[0.06] my-2 mx-2 max-w-[calc(100%-16px)]"></div>

                    <button class="w-full glass-card h-14 px-5 rounded-2xl flex items-center justify-between group transition-all active:scale-[0.98]">
                        <div class="flex items-center gap-3.5">
                            <div class="p-1.5 rounded-lg bg-white/5 text-neutral-400 group-hover:text-white group-hover:bg-white/10 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="file-text" class="lucide lucide-file-text w-4 h-4"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"></path><path d="M14 2v5a1 1 0 0 0 1 1h5"></path><path d="M10 9H8"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg>
                            </div>
                            <span class="text-sm font-medium text-neutral-200 group-hover:text-white">Terms of Use</span>
                        </div>

                    </button>

                    <button class="w-full glass-card h-14 px-5 rounded-2xl flex items-center justify-between group transition-all active:scale-[0.98]">
                        <div class="flex items-center gap-3.5">
                            <div class="p-1.5 rounded-lg bg-white/5 text-neutral-400 group-hover:text-white group-hover:bg-white/10 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="shield-check" class="lucide lucide-shield-check w-4 h-4"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg>

                        </div>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="chevron-right" class="lucide lucide-chevron-right w-4 h-4 text-neutral-600 group-hover:text-neutral-400 transition-colors"><path d="m9 18 6-6-6-6"></path></svg>
                    </button>

                    <button class="w-full mt-4 h-12 px-5 rounded-xl flex items-center justify-center gap-2 group hover:bg-red-500/10 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="log-out" class="lucide lucide-log-out w-4 h-4 text-neutral-500 group-hover:text-red-400 transition-colors"><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path></svg>

                </div>
            </div>
        </div>

        <!-- VIEW 2: Edit Profile -->
        <div id="view-edit" class="view-section">
            <div class="w-full px-6 pt-8 pb-4 flex justify-between items-center shrink-0">
                <button onclick="goBack('view-edit')" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-neutral-400 hover:text-white hover:bg-white/5 transition-colors group">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="arrow-left" class="lucide lucide-arrow-left w-5 h-5 group-hover:-translate-x-0.5 transition-transform"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>

                <span class="text-sm font-medium text-white">Edit Profile</span>
                <button class="text-xs font-semibold text-purple-400 hover:text-purple-300 transition-colors" onclick="saveProfile()">Save</button>
            </div>

            <div class="flex-1 w-full overflow-y-auto hide-scrollbar px-6 pb-10">

                        </div>
                        <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="camera" class="lucide lucide-camera w-8 h-8 text-white drop-shadow-lg"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"></path><circle cx="12" cy="13" r="3"></circle></svg>
                        </div>

                </div>

                <!-- Form Fields -->
                <div class="space-y-5">
                    <div class="space-y-1.5">
                        <label class="text-[10px] uppercase tracking-wider font-semibold text-neutral-500 ml-1">Display Name</label>

                    <div class="space-y-1.5">
                        <label class="text-[10px] uppercase tracking-wider font-semibold text-neutral-500 ml-1">Location</label>

                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="map-pin" class="lucide lucide-map-pin w-4 h-4 text-neutral-500"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg>

                    <div class="pt-2">

                            <div class="relative inline-block w-10 h-5 align-middle select-none transition duration-200 ease-in">
                                <input type="checkbox" name="toggle" id="toggle" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 border-[#1a1a1a] appearance-none cursor-pointer peer checked:right-0 right-5 transition-all duration-300">

        <!-- VIEW 3: Apply to Artist -->
        <div id="view-apply" class="view-section">
            <div class="w-full px-6 pt-8 pb-4 flex justify-between items-center shrink-0">
                <button onclick="goBack('view-apply')" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-neutral-400 hover:text-white hover:bg-white/5 transition-colors group">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="arrow-left" class="lucide lucide-arrow-left w-5 h-5 group-hover:-translate-x-0.5 transition-transform"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
                </button>
                <span class="text-sm font-medium text-white">Apply to Artist</span>
                <div class="w-8"></div>
            </div>

            <div class="flex-1 w-full overflow-y-auto hide-scrollbar px-6 pb-10">
                <!-- Hero Banner -->
                <div class="w-full h-32 rounded-2xl bg-gradient-to-br from-purple-900/40 via-purple-900/20 to-transparent border border-purple-500/20 mb-6 flex flex-col items-center justify-center text-center p-4 relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-purple-500/20 rounded-full blur-2xl -mr-10 -mt-10"></div>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="sparkles" class="lucide lucide-sparkles w-6 h-6 text-purple-400 mb-2 relative z-10"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"></path><path d="M20 2v4"></path><path d="M22 4h-4"></path><circle cx="4" cy="20" r="2"></circle></svg>
                    <h2 class="text-lg font-semibold text-white relative z-10 tracking-tight">Become a Creator</h2>
                    <p class="text-xs text-purple-200/70 relative z-10">Unlock exclusive tools &amp; badges</p>
                </div>

                <div class="space-y-5">
                    <div class="space-y-1.5">
                        <label class="text-[10px] uppercase tracking-wider font-semibold text-neutral-500 ml-1">Portfolio URL</label>
                        <div class="custom-input rounded-xl px-4 py-3 flex items-center gap-3 group focus-within:ring-1 ring-purple-500/30">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="link" class="lucide lucide-link w-4 h-4 text-neutral-500 group-focus-within:text-purple-400 transition-colors"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                            <input type="url" placeholder="https://dribbble.com/yourname" class="bg-transparent w-full text-sm text-white placeholder-neutral-600 outline-none font-medium">
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-[10px] uppercase tracking-wider font-semibold text-neutral-500 ml-1">Social Handle</label>
                        <div class="custom-input rounded-xl px-4 py-3 flex items-center gap-3 group focus-within:ring-1 ring-purple-500/30">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="instagram" class="lucide lucide-instagram w-4 h-4 text-neutral-500 group-focus-within:text-purple-400 transition-colors"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"></line></svg>
                            <input type="text" placeholder="@username" class="bg-transparent w-full text-sm text-white placeholder-neutral-600 outline-none font-medium">
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-[10px] uppercase tracking-wider font-semibold text-neutral-500 ml-1">Artist Statement</label>
                        <div class="custom-input rounded-xl px-4 py-3 flex items-start gap-3 h-24 group focus-within:ring-1 ring-purple-500/30">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="message-square" class="lucide lucide-message-square w-4 h-4 text-neutral-500 mt-0.5 group-focus-within:text-purple-400 transition-colors"><path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"></path></svg>
                            <textarea placeholder="Tell us about your art style..." class="bg-transparent w-full h-full text-sm text-white placeholder-neutral-600 outline-none resize-none font-medium leading-relaxed"></textarea>
                        </div>
                    </div>

                    <!-- Custom Checkbox -->
                    <label class="flex items-start gap-3 p-1 cursor-pointer custom-checkbox group">
                        <div class="relative flex items-center">
                            <input type="checkbox" class="peer sr-only">
                            <div class="w-5 h-5 border border-white/20 rounded-md bg-white/5 peer-checked:bg-purple-500 peer-checked:border-purple-500 transition-all flex items-center justify-center">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="check" class="lucide lucide-check w-3 h-3 text-white opacity-0 peer-checked:opacity-100 transition-opacity"><path d="M20 6 9 17l-5-5"></path></svg>
                            </div>
                        </div>
                        <span class="text-xs text-neutral-400 group-hover:text-neutral-300 transition-colors leading-tight pt-0.5">
                            I confirm that the work in my portfolio is original and created by me.
                        </span>
                    </label>

                    <button class="w-full py-3.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-medium text-sm transition-all shadow-[0_0_20px_rgba(168,85,247,0.3)] hover:shadow-[0_0_30px_rgba(168,85,247,0.5)] mt-2">
                        Submit Application
                    </button>
                </div>
            </div>
        </div>

        <!-- Bottom Fade -->
        <div class="absolute bottom-0 w-full h-12 bg-gradient-to-t from-[#080808] to-transparent pointer-events-none z-20"></div>

    </div>

    <script>
        lucide.createIcons();

        function openView(viewId) {
            const mainView = document.getElementById('view-main');
            const targetView = document.getElementById(viewId);
            
            // Slide main out to left
            mainView.classList.add('exit-left');
            mainView.classList.remove('active');

            // Slide target in from right (handled by CSS default position) and activate
            setTimeout(() => {
                targetView.classList.add('active');
            }, 50); // Small delay for rendering
        }

        function goBack(currentViewId) {
            const currentView = document.getElementById(currentViewId);
            const mainView = document.getElementById('view-main');

            // Deactivate current view
            currentView.classList.remove('active');

            // Bring main view back
            setTimeout(() => {
                mainView.classList.remove('exit-left');
                mainView.classList.add('active');
            }, 50);
        }

        function saveProfile() {
            // Simulated save action
            const btn = document.querySelector('#view-edit button.text-purple-400');
            const originalText = btn.innerText;
            
            btn.innerText = 'Saved!';
            btn.classList.add('text-green-400');
            btn.classList.remove('text-purple-400');
            
            setTimeout(() => {
                goBack('view-edit');
                // Reset button after transition
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.classList.remove('text-green-400');
                    btn.classList.add('text-purple-400');
                }, 500);
            }, 600);
        }
    </script>

</body></html>
