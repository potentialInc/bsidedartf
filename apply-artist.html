<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bSide - Apply to Artist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link
        href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Inter:wght@300;400;500;600&amp;display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Geist', 'Inter', sans-serif;
            background-color: #050505;
            color: #ffffff;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Input Styles */
        .custom-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.2s ease;
        }

        .custom-input:focus-within {
            border-color: rgba(168, 85, 247, 0.4);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 1px rgba(168, 85, 247, 0.1);
        }

        /* Checkbox Custom */
        .custom-checkbox input:checked+div {
            background-color: #a855f7;
            border-color: #a855f7;
        }
    </style>
    <link id="all-fonts-link-font-dm-sans" rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&amp;display=swap">
    <style id="all-fonts-style-font-dm-sans">
        .font-dm-sans {
            font-family: 'DM Sans', sans-serif !important;
        }
    </style>
</head>

<body
    class="min-h-screen flex items-center justify-center overflow-hidden w-full bg-[#050505] selection:bg-purple-500/30">

    <!-- Ambient Background -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-[-10%] left-[-20%] w-[600px] h-[600px] bg-purple-900/10 rounded-full blur-[120px]">
        </div>
        <div class="absolute bottom-[-10%] right-[-20%] w-[600px] h-[600px] bg-indigo-900/10 rounded-full blur-[120px]">
        </div>
        <div class="absolute inset-0 opacity-[0.02] bg-[url('https://grainy-gradients.vercel.app/noise.svg')]"></div>
    </div>

    <!-- Main UI Container -->
    <div
        class="relative z-10 w-full max-w-[400px] h-[840px] bg-[#080808] rounded-[40px] border border-white/10 shadow-2xl overflow-hidden ring-1 ring-white/5 flex flex-col">

        <!-- Header -->
        <div class="w-full px-6 pt-8 pb-4 flex justify-between items-center shrink-0">
            <button onclick="window.location.href='mypage.html'"
                class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-neutral-400 hover:text-white hover:bg-white/5 transition-colors group">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    data-lucide="arrow-left"
                    class="lucide lucide-arrow-left w-5 h-5 group-hover:-translate-x-0.5 transition-transform">
                    <path d="m12 19-7-7 7-7"></path>
                    <path d="M19 12H5"></path>
                </svg>
            </button>
            <span class="text-sm font-medium text-white">Apply to Artist</span>
            <div class="w-8"></div>
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 w-full overflow-y-auto hide-scrollbar px-6 pb-10">
            <!-- Hero Banner -->
            <div
                class="w-full h-32 rounded-2xl bg-gradient-to-br from-purple-900/40 via-purple-900/20 to-transparent border border-purple-500/20 mb-6 flex flex-col items-center justify-center text-center p-4 relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-purple-500/20 rounded-full blur-2xl -mr-10 -mt-10">
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    data-lucide="sparkles" class="lucide lucide-sparkles w-6 h-6 text-purple-400 mb-2 relative z-10">
                    <path
                        d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z">
                    </path>
                    <path d="M20 2v4"></path>
                    <path d="M22 4h-4"></path>
                    <circle cx="4" cy="20" r="2"></circle>
                </svg>
                <h2 class="text-lg font-semibold text-white relative z-10 tracking-tight">Become a Creator</h2>
                <p class="text-xs text-purple-200/70 relative z-10">Unlock exclusive tools &amp; badges</p>
            </div>

            <div class="space-y-5">
                <div class="space-y-1.5">
                    <label class="text-[10px] uppercase tracking-wider font-semibold text-neutral-500 ml-1">Portfolio
                        URL</label>
                    <div
                        class="custom-input rounded-xl px-4 py-3 flex items-center gap-3 group focus-within:ring-1 ring-purple-500/30">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            data-lucide="link"
                            class="lucide lucide-link w-4 h-4 text-neutral-500 group-focus-within:text-purple-400 transition-colors">
                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                        </svg>
                        <input type="url" placeholder="https://dribbble.com/yourname"
                            class="bg-transparent w-full text-sm text-white placeholder-neutral-600 outline-none font-medium">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-[10px] uppercase tracking-wider font-semibold text-neutral-500 ml-1">Social
                        Handle</label>
                    <div
                        class="custom-input rounded-xl px-4 py-3 flex items-center gap-3 group focus-within:ring-1 ring-purple-500/30">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            data-lucide="instagram"
                            class="lucide lucide-instagram w-4 h-4 text-neutral-500 group-focus-within:text-purple-400 transition-colors">
                            <rect width="20" height="20" x="2" y="2" rx="5" ry="5"></rect>
                            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                            <line x1="17.5" x2="17.51" y1="6.5" y2="6.5"></line>
                        </svg>
                        <input type="text" placeholder="@username"
                            class="bg-transparent w-full text-sm text-white placeholder-neutral-600 outline-none font-medium">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-[10px] uppercase tracking-wider font-semibold text-neutral-500 ml-1">Artist
                        Statement</label>
                    <div
                        class="custom-input rounded-xl px-4 py-3 flex items-start gap-3 h-24 group focus-within:ring-1 ring-purple-500/30">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            data-lucide="message-square"
                            class="lucide lucide-message-square w-4 h-4 text-neutral-500 mt-0.5 group-focus-within:text-purple-400 transition-colors">
                            <path
                                d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z">
                            </path>
                        </svg>
                        <textarea placeholder="Tell us about your art style..."
                            class="bg-transparent w-full h-full text-sm text-white placeholder-neutral-600 outline-none resize-none font-medium leading-relaxed"></textarea>
                    </div>
                </div>

                <!-- Custom Checkbox -->
                <label class="flex items-start gap-3 p-1 cursor-pointer custom-checkbox group">
                    <div class="relative flex items-center">
                        <input type="checkbox" class="peer sr-only">
                        <div
                            class="w-5 h-5 border border-white/20 rounded-md bg-white/5 peer-checked:bg-purple-500 peer-checked:border-purple-500 transition-all flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" data-lucide="check"
                                class="lucide lucide-check w-3 h-3 text-white opacity-0 peer-checked:opacity-100 transition-opacity">
                                <path d="M20 6 9 17l-5-5"></path>
                            </svg>
                        </div>
                    </div>
                    <span
                        class="text-xs text-neutral-400 group-hover:text-neutral-300 transition-colors leading-tight pt-0.5">
                        I confirm that the work in my portfolio is original and created by me.
                    </span>
                </label>

                <button
                    class="w-full py-3.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-medium text-sm transition-all shadow-[0_0_20px_rgba(168,85,247,0.3)] hover:shadow-[0_0_30px_rgba(168,85,247,0.5)] mt-2">
                    Submit Application
                </button>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>

</body>

</html>
